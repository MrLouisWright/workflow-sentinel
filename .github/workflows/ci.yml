name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [18, 20, 22] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify ESM import and CJS require
        run: |
          node --input-type=module -e "import { scanText } from 'workflow-sentinel'; if (!scanText) process.exit(1)"
          node -e "require('workflow-sentinel').scanText('on: push\npermissions: {}\njobs:\n  a:\n    runs-on: x\n    steps:\n      - run: true\n', 'w.yml')"
      - run: npm pack --dry-run
      - name: Dogfood
        run: node bin/workflow-sentinel.js --fail-on medium
